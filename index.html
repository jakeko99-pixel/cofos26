<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reto COFO Huesca (Corrección Táctil)</title>
    <style>
        :root { 
            --primary: #1e3a8a; 
            --accent: #10b981; 
            --text-on-primary: #ffffff;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: #eef2f7; 
            overflow: hidden; /* Importante: bloquea scroll total */
            text-align: center;
            -webkit-user-select: none; /* Bloquea selección texto */
            user-select: none;
            touch-action: none; /* Bloquea gestos nativos del navegador */
            overscroll-behavior: none; /* Bloquea efecto rebote */
        }
        
        /* Pantallas de flujo */
        #setup-screen, #end-screen { 
            position: fixed; inset: 0; background: white; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }

        h1 { font-size: 2.5rem; margin-top: 0; color: var(--primary); }
        @media (max-width: 600px) { h1 { font-size: 1.8rem; } }

        .instrucciones-caja {
            background: #f8fafc; border-left: 6px solid var(--primary); padding: 15px;
            border-radius: 8px; text-align: left; margin-bottom: 20px; max-width: 500px;
        }
        .instrucciones-caja h2 { margin-top: 0; color: var(--primary); font-size: 1.3rem;}
        .instrucciones-caja ul { font-size: 1rem; line-height: 1.4; padding-left: 20px;}

        .input-grande { padding: 12px; font-size: 1.1rem; border-radius: 8px; border: 2px solid #ccc; width: 80%; max-width: 300px; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-top: 15px;}
        .btn-ranking { background: #db4437; }

        /* UI Juego */
        #header { background: var(--primary); color: white; padding: 10px; position: relative; z-index: 10; }
        #question-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        #options-text { font-size: 0.9rem; opacity: 0.9; }
        @media (min-width: 768px) { #question-text { font-size: 2rem; } #options-text { font-size: 1.3rem; } }

        .hud-tag { position: fixed; top: 120px; padding: 5px 15px; border-radius: 20px; font-weight: bold; color: white; z-index: 10; }
        #score-tag { right: 10px; background: var(--accent); }
        #timer-tag { left: 10px; background: #ef4444; }

        #game-container { 
            position: relative; width: 100vw; height: 100vh;
            overflow: hidden; display: none; background: #87CEEB;
            touch-action: none; /* Asegura captura táctil */
        }

        .falling-letter { 
            position: absolute; font-size: 30px; font-weight: bold; background: white; 
            border-radius: 50%; width: 55px; height: 55px; 
            display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        /* --- CORRECCIÓN MOCHILA --- */
        #player { 
            position: absolute; 
            bottom: 120px; /* Separación suelo */
            left: 50%; 
            font-size: 80px; /* Tamaño */
            width: 80px; /* Ancho físico */
            height: 80px; /* Alto físico */
            display: flex; align-items: center; justify-content: center;
            transform: translateX(-50%); 
            will-change: left;
            z-index: 5;
            cursor: pointer;
        }

        #qr-container { margin-top: 20px; display: none; text-align: center; }
        #qr-image { width: 130px; height: 130px; }
    </style>
</head>
<body>

<div id="setup-screen">
    <h1>🎒 Reto COFO</h1>
    <div class="instrucciones-caja">
        <h2>📜 Cómo jugar</h2>
        <ul>
            <li>Atrapa la letra correcta con la mochila (🎒).</li>
            <li>Tienes <b>25 segundos</b>. Esquiva las incorrectas.</li>
            <li>En PC usa flechas, en móvil <b>arrastra con el dedo</b>.</li>
        </ul>
    </div>
    <input type="text" id="player-name" placeholder="Pseudónimo" class="input-grande" maxlength="15">
    <button class="btn" onclick="startGame()">Empezar</button>
    <div id="qr-container">
        <img id="qr-image" src="" alt="QR">
    </div>
</div>

<div id="game-ui" style="display:none;">
    <div id="header">
        <div id="question-text"></div>
        <div id="options-text"></div>
    </div>
    <div id="score-tag" class="hud-tag">0</div>
    <div id="timer-tag" class="hud-tag">⏱️ 25s</div>
</div>

<div id="game-container">
    <div id="player">🎒</div>
</div>

<div id="end-screen" style="display:none;">
    <h1>¡Puntuación!</h1>
    <h2 id="final-msg"></h2>
    <button class="btn btn-ranking" onclick="sendToGoogleForm()">🏆 Enviar al Ranking</button>
</div>

<script>
    // --- QR AUTOMÁTICO ---
    window.onload = function() {
        if (window.location.href.startsWith("http")) {
            document.getElementById('qr-image').src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(window.location.href);
            document.getElementById('qr-container').style.display = "block";
        }
    };

    // --- LÓGICA JUEGO ---
    let playerName = "";
    let score = 0;
    let currentQ = 0;
    let isGameActive = false;
    let timeLeft = 25; 
    let playerX = 50; 
    const player = document.getElementById('player');
    const container = document.getElementById('game-container');

    const questions = [
        { q: "1. ¿Asistencia mínima para certificar en Aragón?", options: "A: 75% | B: 85% | C: 90% | D: 100%", correct: "B" },
        { q: "2. Documento principal en junio en DOCEO para evaluar:", options: "A: P.I.F. | B: Acta firmas | C: La Memoria | D: Gastos", correct: "C" },
        { q: "3. Obligatorio subir a DOCEO (horas no presenciales):", options: "A: Evidencias | B: Fotos catering | C: CVs | D: Vídeos", correct: "A" },
        { q: "4. ¿Quién revisa en DOCEO y autoriza certificar?", options: "A: Dirección | B: Consejería | C: Mentoría CP | D: DP", correct: "C" },
        { q: "5. Tarea en junio para planificar el nuevo PFC:", options: "A: Libros texto | B: Detección necesidades | C: Hoteles | D: Despidos", correct: "B" },
        { q: "6. ¿Por qué enviar copia de memorias al Equipo Directivo?", options: "A: Archivo histórico | B: Pago DOCEO | C: Venta material | D: Adjuntar Memoria Final", correct: "D" }
    ];

    function startGame() {
        playerName = document.getElementById('player-name').value.trim() || "COFO";
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        container.style.display = 'block';
        // Forzar posición inicial
        player.style.left = "50%";
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQ >= questions.length) return endGame();
        document.getElementById('question-text').innerText = questions[currentQ].q;
        document.getElementById('options-text').innerText = questions[currentQ].options;
        isGameActive = true;
        timeLeft = 25; 
        document.getElementById('timer-tag').innerText = `⏱️ ${timeLeft}s`;
        document.getElementById('score-tag').innerText = score;
        
        // Temporizador pregunta
        window.qTimer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-tag').innerText = `⏱️ ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(window.qTimer);
                clearInterval(window.sTimer);
                currentQ++;
                loadQuestion();
            }
        }, 1000);

        // Lluvia letras
        window.sTimer = setInterval(() => spawnLetter(), 700);
    }

    function spawnLetter() {
        if (!isGameActive) return;
        const letters = ['A', 'B', 'C', 'D'];
        const char = letters[Math.floor(Math.random() * 4)];
        const el = document.createElement('div');
        el.className = 'falling-letter';
        el.innerText = char;
        el.style.left = (Math.random() * 80 + 10) + "%";
        el.style.top = "-60px";
        container.appendChild(el);

        let y = -60;
        let speed = (window.innerHeight * 0.006) + Math.random() * 2;
        
        let loop = setInterval(() => {
            if (!isGameActive) { clearInterval(loop); el.remove(); return; }
            y += speed;
            el.style.top = y + "px";
            
            let pR = player.getBoundingClientRect();
            let lR = el.getBoundingClientRect();

            // Colisión
            if (lR.bottom > pR.top && lR.top < pR.bottom && lR.right > pR.left && lR.left < pR.right) {
                if (char === questions[currentQ].correct) score += 10;
                else score = Math.max(0, score - 2);
                document.getElementById('score-tag').innerText = score;
                clearInterval(loop);
                el.remove();
            }
            if (y > window.innerHeight) { clearInterval(loop); el.remove(); }
        }, 20);
    }

    // --- CORRECCIÓN CONTROLES TÁCTILES ROBUSTOS ---

    // 1. Teclado PC (sigue funcionando)
    window.addEventListener('keydown', (e) => {
        if (!isGameActive) return;
        if (e.key === 'ArrowLeft') playerX = Math.max(8, playerX - 6);
        if (e.key === 'ArrowRight') playerX = Math.min(92, playerX + 6);
        player.style.left = playerX + "%";
    });

    // 2. Táctil (Móvil) - SISTEMA REESCRITO
    let isTouching = false;

    // Función unificada para mover
    function handleTouchMove(e) {
        if (!isGameActive || !e.touches || e.touches.length === 0) return;
        
        // Previene cualquier comportamiento nativo (scroll, zoom)
        if(e.cancelable && typeof e.preventDefault === 'function') {
            e.preventDefault();
        }
        
        // Obtenemos X del primer dedo respecto a la ventana
        const clientX = e.touches[0].clientX;
        const windowWidth = window.innerWidth;
        
        // Calculamos porcentaje y aplicamos límites estrictos
        let newXPercent = (clientX / windowWidth) * 100;
        
        if (newXPercent < 8) newXPercent = 8; // Límite izquierdo
        if (newXPercent > 92) newXPercent = 92; // Límite derecho
        
        playerX = newXPercent;
        player.style.left = playerX + "%";
    }

    // Escuchamos directamente en el contenedor del juego para máxima captura
    container.addEventListener('touchstart', (e) => {
        isTouching = true;
        handleTouchMove(e); // Mueve instantáneamente al tocar
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
        if(isTouching) handleTouchMove(e);
    }, { passive: false });

    container.addEventListener('touchend', () => {
        isTouching = false;
    });

    container.addEventListener('touchcancel', () => {
        isTouching = false;
    });


    // --- FINAL ---
    function endGame() {
        isGameActive = false;
        clearInterval(window.qTimer);
        clearInterval(window.sTimer);
        document.getElementById('game-ui').style.display = 'none';
        container.style.display = 'none';
        document.getElementById('end-screen').style.display = 'flex';
        document.getElementById('final-msg').innerText = `${playerName}: ${score} puntos.`;
    }

    function sendToGoogleForm() {
        const formId = "1FAIpQLSdnPa3moGcnx4kltvwL9IFxVgcUU7sntOjeNttbAe1leUbSoA";
        const entryName = "entry.1083425001";
        const entryScore = "entry.422197715";
        const url = `https://docs.google.com/forms/d/e/${formId}/viewform?usp=pp_url&${entryName}=${encodeURIComponent(playerName)}&${entryScore}=${score}`;
        window.open(url, '_blank');
    }
</script>
</body>
</html>
